<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0c2a18"/>
      <stop offset="55%" stop-color="#04140b"/>
      <stop offset="100%" stop-color="#020a06"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- accent ring -->
  <circle cx="512" cy="470" r="285" fill="none" stroke="#22c55e" stroke-width="16" opacity="0.55"/>

  <!-- ball -->
  <circle cx="512" cy="470" r="250" fill="#ffffff"/>

  <!-- central pentagon -->
  <polygon points="512,390 588,445 559,535 465,535 436,445" fill="#0a0f0d"/>

  <!-- seams radiating to the edge -->
  <g stroke="#0a0f0d" stroke-width="14" stroke-linecap="round">
    <line x1="512" y1="390" x2="512" y2="222"/>
    <line x1="588" y1="445" x2="748" y2="393"/>
    <line x1="559" y1="535" x2="658" y2="671"/>
    <line x1="465" y1="535" x2="366" y2="671"/>
    <line x1="436" y1="445" x2="276" y2="393"/>
  </g>

  <!-- wordmark -->
  <text x="512" y="855" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="96" font-weight="900" fill="#ffffff" letter-spacing="4">DUEL</text>
</svg>
